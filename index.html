<!doctype html>
<html lang="vi">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hải Đăng Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Be+Vietnam+Pro:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF8F3; --surface:#F1EDE4; --surface2:#E7E1D4; --ink:#121A1F; --muted:#5B6670;
  --accent:#FFC83D; --accent-ink:#121A1F; --night:#121A1F; --line:#DCD5C6; --bad:#B3261E; --ok:#2F6B3A;
  --rail:232px; --maxw:920px;
}
@media (min-width:1300px){:root{--maxw:1200px}}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden;background:var(--bg);color:var(--ink);font-family:'Be Vietnam Pro',system-ui,sans-serif;font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
.disp{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;letter-spacing:-.02em;line-height:1}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}

/* shell */
.rail{position:fixed;left:0;top:0;bottom:0;width:var(--rail);background:var(--night);color:var(--bg);display:flex;flex-direction:column;padding:28px 20px;gap:28px;z-index:5}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand span{font-size:26px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;text-decoration:none;font-weight:500;color:#C9CED2;border-left:4px solid transparent}
.nav a[aria-current=page]{color:var(--bg);border-left-color:var(--accent);background:#1C272E}
.nav svg{flex:0 0 auto}
.rail .foot{margin-top:auto;font-size:13px;color:#8D979E;line-height:1.5}
.rail .foot b{color:var(--bg);font-weight:500}
main{margin-left:var(--rail);min-height:100vh}
.wrap{max-width:var(--maxw);padding:40px 48px 120px}
.topbar{display:none}
.tabbar{display:none}

@media (max-width: 899px){
  .rail{display:none}
  main{margin-left:0}
  .wrap{padding:20px 18px 120px}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:var(--night);color:var(--bg);position:sticky;top:0;z-index:5}
  .topbar .brand span{font-size:22px}
  .topbar .sync{font-size:13px;color:#8D979E}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--night);z-index:6;padding-bottom:env(safe-area-inset-bottom)}
  .tabbar a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 10px;font-size:13px;color:#AEB6BC;text-decoration:none;border-top:3px solid transparent}
  .tabbar a[aria-current=page]{color:var(--bg);border-top-color:var(--accent)}
}

/* type scale: 13 / 16 / 20 / 30 / 56+ */
.eyebrowless{font-size:13px}
.h-hero{font-size:clamp(44px,8vw,84px)}
.h-sec{font-size:30px}
.lead{font-size:20px;line-height:1.45}
.small{font-size:13px;line-height:1.45}

.sec{margin-top:56px}
.sec:first-child{margin-top:0}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:18px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;background:var(--ink);color:var(--bg);font-weight:700;padding:13px 18px;min-height:46px;cursor:pointer;text-decoration:none}
.btn.lamp{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface);color:var(--ink)}
.btn.small{padding:10px 14px;min-height:44px;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.linkbtn{background:none;border:0;padding:0;font-weight:700;text-decoration:underline;text-underline-offset:3px;cursor:pointer}

/* fields */
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500}
input[type=text],input[type=number],input[type=url],select,textarea{background:#fff;border:2px solid var(--line);padding:11px 12px;min-height:46px;width:100%;border-radius:0}
textarea{min-height:90px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{border-color:var(--ink);outline:none}

/* today */
.today-hero{background:var(--night);color:var(--bg);margin:-40px 0 0 -48px;width:calc(100vw - var(--rail));max-width:none;padding:40px max(48px, calc(100vw - var(--rail) - var(--maxw) + 48px)) 36px 48px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:32px;align-items:end}
.today-hero img{width:100%;height:220px;object-fit:cover;display:block}
.today-hero .kicker{font-size:16px;color:#C9CED2}
.today-hero .city{font-size:20px;margin-top:10px}
.today-hero .lamp-mark{color:var(--accent)}
@media (max-width:899px){.today-hero{margin:-20px 0 0 -18px;width:100vw;padding:24px 18px 24px;grid-template-columns:1fr}.today-hero img{height:180px}}
.facts{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px 20px;font-size:17px}
.facts dt{font-weight:700}
.facts dd{margin:0}
@media (max-width:600px){.facts{grid-template-columns:1fr;gap:2px}.facts dd{margin-bottom:12px}}
.strip{background:var(--surface);padding:22px 24px}
.progress{height:10px;background:var(--surface2);position:relative}
.progress i{position:absolute;left:0;top:0;bottom:0;background:var(--ink)}
.progress i.lamp{background:var(--accent)}
.progress i.over{background:var(--bad)}

/* checklist */
.check{list-style:none;margin:0;padding:0}
.check li{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.check li:last-child{border-bottom:0}
.check input{width:22px;height:22px;margin-top:2px;accent-color:var(--ink);flex:0 0 auto}
.check li.done span{color:var(--muted);text-decoration:line-through}

/* itinerary */
.ep-block{margin-top:44px}
.ep-block:first-child{margin-top:0}
.ep-title{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:end;border-bottom:3px solid var(--ink);padding-bottom:10px;margin-bottom:6px}
.day-row{display:grid;grid-template-columns:76px minmax(0,1fr) 92px;gap:16px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);text-decoration:none;cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.day-row:hover .t{text-decoration:underline}
.day-row .d{font-family:'Bricolage Grotesque';font-weight:800;font-size:30px;line-height:1}
.day-row .d small{display:block;font-family:'Be Vietnam Pro';font-weight:500;font-size:13px;color:var(--muted);margin-top:4px}
.day-row img{width:92px;height:62px;object-fit:cover;display:block}
.day-row .ph{width:92px;height:62px;background:var(--surface)}
.day-row.is-today{background:var(--accent);margin:0 -14px;padding:14px;width:calc(100% + 28px);grid-template-columns:76px minmax(0,1fr) 92px}
.day-row.past .t{color:var(--muted)}
.tag{display:inline-block;font-size:13px;font-weight:700;padding:2px 8px;background:var(--ink);color:var(--bg);margin-left:6px;vertical-align:2px}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(18,26,31,.55);z-index:20;display:none}
.sheet{position:fixed;z-index:21;background:var(--bg);display:none;overflow:auto;right:0;top:0;bottom:0;width:min(560px,100%)}
.sheet.open,.sheet-bg.open{display:block}
.sheet img.cover{width:100%;height:240px;object-fit:cover;display:block}
.sheet .in{padding:24px 28px 60px}
.sheet .close{position:absolute;top:12px;right:12px}
@media (max-width:899px){.sheet{top:auto;height:92vh;width:100%}}

/* money */
.big-money{font-size:clamp(40px,7vw,64px)}
.cat-row{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:6px 16px;padding:12px 0;border-bottom:1px solid var(--line)}
.cat-row .progress{grid-column:1/-1}
.exp-day{margin-top:22px}
.exp-day h3{font-size:16px;font-weight:700;padding-bottom:6px;border-bottom:2px solid var(--ink)}
.exp{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.unit{display:inline-flex;border:2px solid var(--ink)}
.unit button{border:0;background:transparent;padding:0 14px;min-height:42px;font-weight:700;cursor:pointer}
.unit button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.add-grid{display:grid;grid-template-columns:minmax(0,1.2fr) auto minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:end}
.add-grid .note{grid-column:1/4}.unit{justify-self:start}.add-grid .wide{white-space:nowrap}
@media (max-width:700px){.add-grid{grid-template-columns:1fr auto}.add-grid .wide,.add-grid .note{grid-column:1/-1}}

/* production */
.ep-tabs{display:flex;gap:6px;overflow-x:auto;margin:0 0 28px;padding-bottom:4px;scrollbar-width:none;scroll-snap-type:x proximity;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent)}
.ep-tabs::-webkit-scrollbar{display:none}
.ep-tabs a{flex:0 0 auto;display:flex;flex-direction:column;gap:1px;padding:9px 14px 10px;text-decoration:none;color:var(--muted);background:var(--surface);scroll-snap-align:start;min-width:104px;transition:background .15s,color .15s}
.ep-tabs a b{font-size:15px;color:var(--ink)}
.ep-tabs a span{font-size:13px;white-space:nowrap}
.ep-tabs a[aria-current=page]{background:var(--ink);color:#C9CED2}
.ep-tabs a[aria-current=page] b{color:var(--accent)}
.ep-tabs a:last-child{margin-right:40px}
.ep-head{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:28px;align-items:start}
.ep-head img{width:100%;height:170px;object-fit:cover;display:block}
@media (max-width:760px){.ep-head{grid-template-columns:1fr}.ep-head img{order:-1;height:160px}}
.subnav{display:grid;grid-template-columns:repeat(4,1fr);margin:28px 0 22px;border:2px solid var(--ink);position:sticky;top:0;z-index:4;background:var(--bg)}
@media (max-width:899px){.subnav{top:56px}}
.subnav button{border:0;border-left:2px solid var(--ink);background:transparent;padding:9px 4px;font-weight:700;cursor:pointer;min-height:46px;font-size:15px;transition:background .15s,color .15s}
.subnav button:first-child{border-left:0}
.subnav button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.dsec{margin-top:40px}
.dsec>h2{font-size:26px}
.dsec .q{font-size:17px;margin-top:8px;padding-left:14px;border-left:4px solid var(--accent)}
.beat{margin-top:18px;background:var(--surface)}
.shotbox{display:grid;place-items:center;width:44px;height:44px;margin:-8px -6px -8px -10px;cursor:pointer}
.beat>summary{list-style:none;display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 16px;cursor:pointer;min-height:56px}
.beat[open]>summary{border-bottom:1px solid var(--line)}
.beat>summary::-webkit-details-marker{display:none}
.beat>summary .bt{font-weight:700;font-size:17px}
.beat>summary .meta{font-size:14px;color:var(--muted);line-height:1.45}
.beat.lamp-beat{background:var(--night);color:var(--bg)}
.beat.lamp-beat .meta{color:#AEB6BC}
.beat .body{padding:0 16px 18px 58px}
@media (max-width:600px){.beat .body{padding:0 14px 16px}}
.shot{width:24px;height:24px;accent-color:var(--ink)}
.lamp-beat .shot{accent-color:var(--accent)}
.lines{display:grid;grid-template-columns:100px minmax(0,1fr);gap:8px 16px;margin:4px 0 16px}
.lines dt{font-weight:700;font-size:14px;padding-top:2px}
.lines dd{margin:0}
.lines dd.say{font-size:17px}
@media (max-width:600px){.lines{grid-template-columns:1fr;gap:0}.lines dd{margin-bottom:10px}}
.place{display:grid;grid-template-columns:220px minmax(0,1fr);gap:16px;background:#fff;color:var(--ink);margin:4px 0 18px}
.place img{width:220px;height:100%;min-height:140px;object-fit:cover;display:block}
.place .ptext{padding:14px 14px 14px 0;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.place .pname{font-weight:700;font-size:18px;line-height:1.3}
.place .ptip{font-size:15px}
.place .pcred{margin-top:2px}
@media (max-width:600px){.place{grid-template-columns:1fr;gap:0}.place img{width:100%;height:180px}.place .ptext{padding:12px 14px 14px}}
.tools{display:grid;gap:14px;border-top:1px solid var(--line);padding-top:14px}
.lamp-beat .tools{border-color:#33424B}
.att{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;gap:6px;align-items:center;background:#fff;color:var(--ink);padding:6px 10px;font-size:14px;max-width:100%}
.chip a{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px}
.chip button{border:0;background:none;cursor:pointer;font-weight:700;padding:0 2px}
.draft{background:#fff;color:var(--ink);padding:12px 14px;font-size:16px}
.script h1{font-size:34px;margin-bottom:12px}
.script h2{font-size:24px;margin:36px 0 8px}
.script p{margin:10px 0;max-width:70ch}
.script ul{margin:8px 0;padding-left:20px}
.script li{margin:6px 0;max-width:70ch}
.script .beat-t{font-weight:700;font-size:18px;margin-top:24px}
.script em{font-style:normal;padding-left:12px;border-left:4px solid var(--accent);display:block}
.pipeline{list-style:none;padding:0;margin:0;counter-reset:none}
.pipeline li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.pipeline .dot{width:20px;height:20px;border:3px solid var(--line);border-radius:50%;margin-top:3px}
.pipeline li.ok .dot{border-color:var(--ink)}
.pipeline li.ok .dot{background:var(--ink)}
.notice{background:var(--surface);padding:16px 18px;font-size:15px}
.notice.warn{background:#FBE9C2}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;z-index:40;font-weight:500;max-width:90vw}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}
.swatch{display:grid;grid-template-columns:repeat(4,1fr);height:120px}
.swatch div{padding:10px;font-size:13px;display:flex;align-items:flex-end}
.hidden{display:none!important}
.donebox{margin-top:10px}
.tsplit>aside .cover{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;margin-bottom:16px}

.tsplit{margin-top:56px}
@media (min-width:1100px){.tsplit{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:56px;align-items:start}.tsplit>aside{position:sticky;top:24px}.tsplit>aside>.sec:first-child{margin-top:0}}
.donebox>summary{cursor:pointer;font-weight:700;color:var(--muted);padding:12px 0;min-height:44px}
/* hiệu ứng */
.fx-hero .lead{margin-top:14px;max-width:60ch}
.jump{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:22px 0 0;padding:8px 0;position:sticky;top:0;z-index:4;background:var(--bg)}
.jump::-webkit-scrollbar{display:none}
@media (max-width:899px){.jump{top:52px;margin-left:-18px;margin-right:-18px;padding:8px 18px}}
.jump a{flex:0 0 auto}
.jump a[aria-current=true]{background:var(--ink);color:var(--bg)}
.jump a{padding:10px 14px;min-height:44px;display:inline-flex;align-items:center;background:var(--surface);text-decoration:none;font-weight:700;font-size:15px}
.jump a:hover{background:var(--accent)}
.steps3{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;counter-reset:s}
.steps3 li{display:flex;flex-direction:column;gap:4px;counter-increment:s}
.steps3 li b::before{content:counter(s) ". ";color:var(--muted)}
.steps3 span{font-size:15px;color:var(--muted)}
@media (max-width:700px){.steps3{grid-template-columns:1fr;gap:14px}}
.fxgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:26px 22px}
.fxc{display:flex;flex-direction:column;gap:4px;min-width:0}
.fxc>b{font-size:17px;margin-top:8px;line-height:1.3}
.fxc .d{color:var(--muted);font-size:15px}
.fxv{position:relative;display:block;width:100%;padding:0;border:0;cursor:zoom-in;aspect-ratio:16/9;overflow:hidden;background:#3a3f42 center/cover no-repeat}
.fxv::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 0 var(--accent);transition:box-shadow .15s}
.fxv:hover::after,.fxv:focus-visible::after{box-shadow:inset 0 0 0 4px var(--accent)}
.fxv .pf{transition:opacity .2s}.fxv.playing .pf{opacity:0}
.fxv canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.fxv video,.fxv img{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:contain}
.fxv.tall{aspect-ratio:9/16;max-width:210px}
.fxc.tall{grid-row:span 2}
.fxv.big{cursor:default}
.fxv.big.tall{max-width:340px;margin:0 auto}
.fxl{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.fxl a{display:inline-flex;align-items:center;min-height:40px;padding:8px 14px;background:var(--surface);font-weight:700;font-size:14px;text-decoration:none}
.fxl a:first-child{background:var(--accent)}
.fxl a:hover{background:var(--ink);color:var(--bg)}
.fxv.big:not(.tall){max-height:70vh}
@media (max-width:560px){.fxgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 12px}.fxc>b{font-size:15px}.fxc .d{font-size:14px}.fxl{gap:4px}.fxl a{padding:8px 10px;font-size:13px}.fxv.tall{max-width:none}}
.fxh{font-size:20px;margin:30px 0 12px;font-weight:800;font-family:'Bricolage Grotesque',sans-serif}
.tgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.tgrid figure{margin:0}.tgrid img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:var(--surface)}
.tgrid figcaption{font-size:15px;margin-top:6px;font-weight:500}
@media (max-width:700px){.tgrid{grid-template-columns:1fr 1fr;gap:14px}}
.brand-band{background:var(--accent);padding:48px}
@media (max-width:899px){.brand-band{margin-left:-18px;margin-right:-18px;padding:36px 18px}}
.btn2{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:560px}
@media (max-width:480px){.btn2{grid-template-columns:1fr}}
.sheet.fxsheet{width:min(860px,100%)}
/* cổng */
.gate{position:fixed;inset:0;z-index:50;background:var(--night);color:var(--bg);display:grid;place-items:center;padding:24px}
.gate.hide{display:none}
.gate form{width:min(380px,100%);display:flex;flex-direction:column;gap:14px}
.gate h1{font-size:44px;margin:14px 0 2px}
.gate input{background:#1C272E;border:2px solid #33424B;color:var(--bg);font-size:18px}
.gate input:focus{border-color:var(--accent)}
.gate .msg{min-height:22px;color:#C9CED2;font-size:15px}
@media (prefers-reduced-motion:no-preference){.fxsheet.open{animation:rise .26s cubic-bezier(.16,1,.3,1)}@keyframes rise{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
@media (prefers-reduced-motion:no-preference){.sheet.open{animation:slide .28s cubic-bezier(.16,1,.3,1)}@keyframes slide{from{transform:translateX(40px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>
<body>
<div class="gate" id="gate"><form id="gateForm">
  <svg width="60" height="40" style="color:var(--accent)" aria-hidden="true"><use href="#mark"/></svg>
  <h1 class="disp">Hải Đăng Studio</h1>
  <p style="color:#C9CED2;margin-bottom:6px">Trang làm việc của kênh. Nhập mật khẩu để mở lịch trình và kịch bản.</p>
  <label class="f" style="color:#C9CED2">Mật khẩu<input type="password" id="gatePass" autocomplete="current-password" required></label>
  <button class="btn lamp" id="gateBtn" type="submit">Mở Studio</button>
  <p class="msg" id="gateMsg" role="status"></p>
</form></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="mark" viewBox="0 0 150 100"><path fill="currentColor" fill-rule="evenodd" d="M20 8 H52 A42 42 0 0 1 52 92 H20 Z M37 25 H52 A25 25 0 0 1 52 75 H37 Z"/><polygon fill="currentColor" points="4,43 96,43 150,35 150,65 96,57 4,57"/></symbol>
